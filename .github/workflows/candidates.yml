name: Release candidates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      manifest_sha256:
        description: SHA-256 of the verified exact-candidate release manifest
        value: ${{ jobs.assemble.outputs.manifest_sha256 }}
permissions:
  contents: read
jobs:
  base:
    name: Frozen base and separate converter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Conversion and distribution regressions
        run: npm run test:distribution
      - name: Package committed source
        run: |
          mkdir -p "$RUNNER_TEMP/release-inputs"
          node scripts/package-release.mjs --revision "$GITHUB_SHA" --out "$RUNNER_TEMP/release-inputs/base"
          node scripts/package-migration.mjs --revision "$GITHUB_SHA" --out "$RUNNER_TEMP/release-inputs/migration"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-candidate
          path: ${{ runner.temp }}/release-inputs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  base-acceptance:
    name: Installed candidate / Node ${{ matrix.node }}
    needs: base
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-candidate
          path: ${{ runner.temp }}/base-input
      - name: Offline install and exercise the identical base archive
        run: |
          candidate_archive=$(node --input-type=module -e 'import fs from "node:fs";import path from "node:path";const folder=path.join(process.env.RUNNER_TEMP,"base-input/base");console.log(path.join(folder,JSON.parse(fs.readFileSync(path.join(folder,"base-record.json"))).filename))')
          GRAINULATOR_TEST_ARCHIVE="$candidate_archive" node scripts/package-isolation-check.mjs

  native:
    uses: ./.github/workflows/native-candidates.yml

  assemble:
    name: Bind passing candidates and generate formula
    needs: [base-acceptance, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/candidate-inputs
      - name: Assemble exact bytes without rebuilding
        id: manifest
        shell: bash
        run: |
          arguments=()
          while IFS= read -r record; do arguments+=(--asset-record "$record"); done < <(find "$RUNNER_TEMP/candidate-inputs" -type f -name asset-record.json)
          node scripts/homebrew-release.mjs --base-record "$RUNNER_TEMP/candidate-inputs/base-candidate/base/base-record.json" --migration-record "$RUNNER_TEMP/candidate-inputs/base-candidate/migration/migration-record.json" "${arguments[@]}" --out "$RUNNER_TEMP/release"
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const pin=crypto.createHash("sha256").update(fs.readFileSync(process.env.RUNNER_TEMP+"/release/release-manifest.json")).digest("hex");fs.appendFileSync(process.env.GITHUB_OUTPUT,"manifest_sha256="+pin+"\n")'
      - name: Revalidate trusted manifest inventory before upload
        env:
          MANIFEST_SHA256: ${{ steps.manifest.outputs.manifest_sha256 }}
        run: node scripts/homebrew-verify-release.mjs --directory "$RUNNER_TEMP/release" --manifest-sha256 "$MANIFEST_SHA256" --source-commit "$GITHUB_SHA"
      - name: Generate literal formula from pinned candidates
        env:
          MANIFEST_SHA256: ${{ steps.manifest.outputs.manifest_sha256 }}
        run: node scripts/homebrew-formula.mjs --manifest "$RUNNER_TEMP/release/release-manifest.json" --manifest-sha256 "$MANIFEST_SHA256" --artifacts "$RUNNER_TEMP/release" --out "$RUNNER_TEMP/grainulator.rb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            ${{ runner.temp }}/release/
            ${{ runner.temp }}/grainulator.rb
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  homebrew:
    name: Actual candidate formula / macOS ARM64
    needs: assemble
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/brew-input
      - name: Run reviewed recipe in a private prefix
        env:
          MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest_sha256 }}
        run: node scripts/homebrew-check.mjs --formula "$RUNNER_TEMP/brew-input/grainulator.rb" --release-dir "$RUNNER_TEMP/brew-input/release" --manifest-sha256 "$MANIFEST_SHA256" --brew /opt/homebrew/bin/brew
