<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SPRINT_NAME}} -- One-Pager</title>
<style>
  /* barn/templates/one-pager.html — single viewport executive summary
     Compact summary; content stays readable when it exceeds one viewport.
     System font stack, no external dependencies, fully self-contained. */

  :root {
    --bg: #141415;
    --bg2: #19191b;
    --bg3: #232325;
    --accent: #3b82f6;
    --accent-light: #60a5fa;
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --orange: #f59e0b;
    --orange-dim: rgba(245,158,11,0.12);
    --red: #e11d48;
    --red-dim: rgba(225,29,72,0.12);
    --purple: #a78bfa;
    --text: #ededed;
    --text-muted: #a1a1a6;
    --text-dim: #85858b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; height: auto; overflow: auto; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 28px 36px 20px;
  }

  header {
    flex-shrink: 0;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding-bottom: 12px;
  }

  header h1 {
    font-size: 18pt; font-weight: 600;
    letter-spacing: 0; color: #fff; margin-bottom: 4px;
  }

  header p {
    font-size: 11pt; color: var(--text-muted);
    line-height: 1.4; max-width: 80%;
  }

  .sprint-label { align-self: flex-start;
    display: inline-block; font-size: 9pt; font-weight: 600;
    letter-spacing: 0; text-transform: none;
    color: var(--text-muted); background: none;
    padding: 0; border-radius: 3px; margin-bottom: 8px;
  }

  main {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 16px;
    min-height: 0;
  }

  /* Left column: top 3 findings */
  .findings {
    grid-column: 1; grid-row: 1;
    display: flex; flex-direction: column;
    gap: 12px; min-height: 0; overflow: visible;
  }

  .findings h2 {
    font-size: 9pt; font-weight: 600;
    text-transform: none; letter-spacing: 0;
    color: var(--accent-light); flex-shrink: 0;
  }

  .finding-card {
    background: var(--bg3); border-radius: 8px;
    padding: 12px 16px; border-left: 3px solid var(--accent);
    flex: 0 0 auto; min-height: 0;
  }

  .finding-card h3 {
    font-size: 11pt; font-weight: 600;
    color: var(--text); margin-bottom: 4px;
  }

  .finding-card p {
    font-size: 9pt; color: var(--text-muted); line-height: 1.4;
  }

  .evidence-badge {
    display: inline-block; font-size: 9pt; font-weight: 600;
    text-transform: none; letter-spacing: 0;
    padding: 2px 8px; border-radius: 3px; margin-top: 4px;
    background: var(--green-dim); color: var(--green);
  }

  .evidence-badge.web { background: var(--orange-dim); color: var(--orange); }
  .evidence-badge.stated { background: rgba(255,255,255,0.06); color: var(--text-dim); }
  .evidence-badge.tested { background: var(--green-dim); color: var(--green); }
  .evidence-badge.documented { background: rgba(59,130,246,0.12); color: var(--accent-light); }
  .evidence-badge.production { background: rgba(167,139,250,0.12); color: var(--purple); }

  /* Right column: recommendation + risk */
  .right-col {
    grid-column: 2; grid-row: 1;
    display: flex; flex-direction: column;
    gap: 12px; min-height: 0;
  }

  .recommendation-box {
    background: var(--bg2); border-radius: 8px;
    padding: 16px 16px; border: 1px solid rgba(59,130,246,0.2);
    flex-shrink: 0;
  }

  .recommendation-box h2 {
    font-size: 9pt; font-weight: 600;
    text-transform: none; letter-spacing: 0;
    color: var(--accent-light); margin-bottom: 8px;
  }

  .recommendation-box p {
    font-size: 11pt; color: var(--text); line-height: 1.4;
  }

  .confidence-meter { margin-top: 12px; }

  .confidence-meter-label {
    font-size: 9pt; color: var(--text-dim);
    text-transform: none; letter-spacing: 0; margin-bottom: 4px;
  }

  .confidence-track {
    width: 100%; height: 6px;
    background: var(--bg3); border-radius: 3px; overflow: hidden;
  }

  .confidence-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .risk-box {
    background: var(--red-dim); border-radius: 8px;
    padding: 12px 16px; border-left: 3px solid var(--red);
    flex: 0 0 auto; min-height: 0; overflow: visible;
  }

  .risk-box h2 {
    font-size: 9pt; font-weight: 600;
    text-transform: none; letter-spacing: 0;
    color: var(--red); margin-bottom: 8px;
  }

  .risk-box p { font-size: 9pt; color: var(--text-muted); line-height: 1.4; }

  /* Footer metadata */
  footer {
    grid-column: 1 / -1; grid-row: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.06);
  }

  footer .meta {
    font-size: 9pt; color: var(--text-dim);
    font-family: monospace; letter-spacing: 0;
  }

  footer .barn-mark { font-size: 9pt; color: var(--text-dim); }

  @media (max-width: 768px) {
    body { padding: 16px; }
    main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    .right-col { grid-column: 1; grid-row: 2; }
    footer { grid-column: 1; grid-row: 3; }
    header h1 { font-size: 14pt; }
    html, body { height: auto; overflow: auto; }
  }

  @media print {
    body { background: #fff; color: #111; }
    header h1 { color: #111; }
    header p { color: #333; }
    .finding-card { background: #f5f5f5; border-color: #999; }
    .finding-card h3 { color: #111; }
    .finding-card p, .risk-box p { color: #333; }
    .recommendation-box { background: #f9f9f9; border-color: #ccc; }
    .recommendation-box p { color: #111; }
    .risk-box { background: #fff0f0; }
    .sprint-label { align-self: flex-start; background: none; color: var(--text-muted); }
    footer .meta, footer .barn-mark { color: #999; }
  }

  /* Evidence documents keep their data prominent and controls quiet. */
  body { font-variant-numeric: tabular-nums; }
  strong, b { font-weight: 600; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) {
    html, body { scroll-behavior: auto; scroll-snap-type: none; }
  }

  @media print {
    :root {
      --bg: #fff; --bg-dark: #fff; --bg2: #f5f5f5; --bg3: #e5e5e5;
      --bg-card: #f5f5f5; --bg-card-alt: #ededed; --bg-card-hover: #e5e5e5;
      --text: #171717; --text-muted: #404040; --text-dim: #525252;
      --accent: #1d4ed8; --accent-light: #1d4ed8; --border: #d4d4d4;
      --green: #166534; --red: #b91c1c; --orange: #92400e; --purple: #6d28d9; --pink: #9d174d;
    }
    h1, h2, h3, h4 { color: #171717; -webkit-text-fill-color: currentColor; }
  }
</style>
</head>
<body>

<header role="banner" aria-label="Sprint header">
  <span class="sprint-label">{{SPRINT_NAME}}</span>
  <h1>{{QUESTION}}</h1>
</header>

<main role="main" aria-label="One-pager content">
  <section class="findings" aria-label="Top findings">
    <h2>Top findings</h2>
    {{TOP_FINDINGS}}
  </section>

  <section class="right-col" aria-label="Recommendation and risk">
    <div class="recommendation-box">
      <h2>Recommendation</h2>
      <p>{{RECOMMENDATION}}</p>
      <div class="confidence-meter">
        <div class="confidence-meter-label">Confidence</div>
        <div class="confidence-track">
          <div class="confidence-fill" style="width: {{CONFIDENCE}}%" aria-label="Confidence level {{CONFIDENCE}} percent"></div>
        </div>
      </div>
    </div>
    <div class="risk-box">
      <h2>Key risk</h2>
      <p>{{KEY_RISK}}</p>
    </div>
  </section>

  <footer aria-label="Metadata">
    <span class="meta">{{META}}</span>
    <span class="barn-mark">Built with barn</span>
  </footer>
</main>

</body>
</html>
