[package]
name = "grainulator-runtime-check"
version = "3.2.0"
edition = "2021"
autobins = false
description = "Grainulator native convergence runtime"
license = "MIT"

[[bin]]
name = "grainulator-runtime-check"
path = "src/main.rs"

# Build-time crates only; the shipped artifact is a single static binary with no install
# dependency (this is the portability runtime-check.js could not give — Node is itself a dep).
[dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[[bin]]
name = "grainulator-runtime-run"
path = "src/bin/grainulator-runtime-run.rs"

[[bin]]
name = "grainulator-runtime-verify"
path = "src/bin/grainulator-runtime-verify.rs"

[[bin]]
name = "grainulator-runtime-hook"
path = "src/bin/grainulator-runtime-hook.rs"

[[bin]]
name = "grainulator-runtime-lessons"
path = "src/bin/grainulator-runtime-lessons.rs"
